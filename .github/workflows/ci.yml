name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Levantar la app con Compose
        run: docker compose up -d --build --wait

      - name: Probar /health
        run: curl -f --retry 5 --retry-connrefused --retry-delay 2 localhost:8000/health

      - name: Probar /visitas
        run: curl -f localhost:8000/visitas

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar todo
        if: always()
        run: docker compose down -v
        
  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build --pull -t devops-lab-app:ci .

      - name: Escanear con Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            devops-lab-app:ci