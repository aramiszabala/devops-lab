name: Publish

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE: ghcr.io/aramiszabala/devops-lab-app

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Calcular la versión
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Construir la imagen
        run: docker build --pull -t $IMAGE:$VERSION -t $IMAGE:latest .

      - name: Escanear con Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            $IMAGE:$VERSION

      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publicar
        run: |
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest